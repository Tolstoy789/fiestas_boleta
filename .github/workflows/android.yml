# Compila la app y corre las pruebas en cada cambio.
# El APK de prueba queda para descargar en la pestaña "Actions" (sección Artifacts).
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la lógica
        run: ./gradlew :core:test

      - name: Compilar APK de prueba
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: divisor-cuentas-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reportes-pruebas
          path: core/build/reports/tests/
